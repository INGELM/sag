<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Compatibilidad de Navegador</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			background: #f8f9fa;
			color: #333;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			height: 100vh;
		}
		.container {
			background: #fff;
			padding: 2rem 2.5rem;
			border-radius: 8px;
			box-shadow: 0 2px 8px rgba(0,0,0,0.08);
			text-align: center;
		}
		h1 {
			color: #d9534f;
		}
		.icon {
			font-size: 4rem;
			margin-bottom: 1rem;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="icon">🚫</div>
		<h1>Chrome no es compatible temporalmente</h1>
		<p>Por favor, utilice <strong>Mozilla Firefox</strong> para acceder al sistema.</p>
		<!--<p>Estamos trabajando para restablecer la compatibilidad lo antes posible. Disculpe las molestias.</p>-->
	</div>
</body>
</html>
