  <body class="">
    <div style="position: fixed; top: 20px; right: 20px; z-index: 1055; min-width: 300px;">
      {% with messages=get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show mb-2" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
    </div>

    <div class="min-vh-100">
      {% block contenido %}
      


      {% endblock %}
           </div>
          <div class="d-flex bg-black w-100 align-items-center justify-content-center position-fixed bottom-0 start-0" style="height: 2rem; z-index: 1030;">
      <p class="text-white m-0">
        &copy; {{ year|default(2024) }} | Desarrollado por <a href="http://sihma.com.ve" class="text-white text-decoration-none">SIHMA C.A.</a>
      </p>
    </div>
