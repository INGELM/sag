<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Error 500</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
			crossorigin="anonymous"
		/>
		<style>
			body {
				background: radial-gradient(1200px circle at 10% 10%, #f8f9fa 0%, #e9ecef 45%, #dee2e6 100%);
				min-height: 100vh;
			}
			.error-card {
				border: 0;
				border-radius: 1rem;
				box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
			}
			.error-code {
				font-size: 5rem;
				font-weight: 800;
				letter-spacing: -2px;
			}
			.icon-circle {
				width: 72px;
				height: 72px;
				border-radius: 50%;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				background: #ffe3e3;
				color: #dc3545;
			}
		</style>
	</head>
	<body>
		<main class="d-flex align-items-center justify-content-center py-5">
			<div class="container">
				<div class="row justify-content-center">
					<div class="col-12 col-md-10 col-lg-7">
						<div class="card error-card">
							<div class="card-body p-4 p-md-5 text-center">
								<div class="icon-circle mb-3">
									<svg
										xmlns="http://www.w3.org/2000/svg"
										width="36"
										height="36"
										fill="currentColor"
										class="bi bi-exclamation-triangle"
										viewBox="0 0 16 16"
										aria-hidden="true"
									>
										<path d="M7.938 2.016a.13.13 0 0 1 .125 0l6.857 3.94c.11.064.11.224 0 .288l-6.857 3.94a.13.13 0 0 1-.125 0L1.08 6.244a.165.165 0 0 1 0-.288l6.857-3.94z" />
										<path d="M8 4.86a.5.5 0 0 1 .5.5v3.8a.5.5 0 0 1-1 0v-3.8a.5.5 0 0 1 .5-.5zm0 6.02a.6.6 0 1 1 0 1.2.6.6 0 0 1 0-1.2z" />
									</svg>
								</div>
								<div class="error-code text-danger">500</div>
								<h1 class="h3 mt-2">Error interno del servidor</h1>
								<p class="text-muted mb-4">
									Ocurrió un problema inesperado. Revise su conexión a internet e Intente nuevamente o regrese al inicio.
								</p>
								<div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
									<a href="/" class="btn btn-primary px-4">Ir al inicio</a>
									<button type="button" class="btn btn-outline-secondary px-4" onclick="window.location.reload();">
										Reintentar
									</button>
								</div>
								<p class="small text-muted mt-4 mb-0">Si el problema persiste, contacta al administrador.</p>
							</div>
						</div>
					</div>
				</div>
			</div>
		</main>
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
			crossorigin="anonymous"
		></script>
	</body>
</html>
